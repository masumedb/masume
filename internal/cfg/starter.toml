# masume configuration for the first run.
#
# Active settings use the defaults. Commented profiles are examples.
# `config.example.toml` lists all settings. docs/configuration.md describes the settings.
#
# The connection form updates its profile block. Other blocks and their comments remain unchanged.
#
# Passwords in config files are ignored. Password sources include prompts, the keyring, commands, environment variables, and secret stores.

# ─────────────────────────────────────────────────────────────────────────────
# Connections
#
# One profile is one connection. The name after `profile.` is the picker label.
# Ctrl+N then n opens the new connection form.
# ─────────────────────────────────────────────────────────────────────────────

# [profile.shop]
# engine               = "postgres"   # postgres mysql sqlserver clickhouse sqlite mongodb
#                                     # timescale redshift neon supabase mariadb tidb
#                                     # planetscale aurora-mysql
# host                 = "127.0.0.1"
# port                 = 5432         # the engine default if omitted
# database             = "shop"       # the file, for sqlite
# user                 = "you"
# auth                 = "password"   # password command prompt keyring secret
# password_env         = "PGPASSWORD" # read the password from the environment
# password_command     = "pass db/shop"   # the command that prints the password
# env                  = "dev"        # dev test prod. prod colours the whole title bar
# mode                 = "write"      # write read-only
# confirm_writes       = "off"        # off delete write agent. unset: off on dev, delete on test, write on prod
# write_plan           = "off"        # off count undo. measure a write before it runs
# undo_rows            = 1000         # the maximum rows captured for an undo. 0 uses an internal ceiling of 1048576
# sslmode              = "prefer"     # disable allow prefer require verify-ca verify-full
# statement_timeout_ms = 0            # 0 leaves the timeout to the server
# keepalive_s          = 30           # seconds between two checks. 0 sends no keepalive
# page_size            = 200          # rows per page
# autocommit           = true         # false begins a transaction on execution, until commit or rollback
# mcp                  = "read-only"  # off read-only read-write full. Never above
#                                     # `[mcp] access` below
# description          = "connection description"
# ai_instructions      = "database instructions for the model"

# A file needs no host, no port and no user.
#
# [profile.notes]
# engine   = "sqlite"
# database = "~/Documents/notes.db"

# ─────────────────────────────────────────────────────────────────────────────
# Interface
# ─────────────────────────────────────────────────────────────────────────────

[ui]
theme               = "ayu-dark"   # a built-in theme, a theme in the adjacent themes directory, or "system" for terminal colours
icons               = "plain"      # plain ascii
hide_system_schemas = true         # false lists pg_catalog and the rest in the tree
key_hints           = "full"       # full main off. main names the primary keys only, off names none

# Glyphs overlay the selected set. An empty string hides that kind.
# These examples are Nerd Font glyphs. A terminal without that font draws empty boxes.
#
# [ui.icon_glyphs]
# schema            = ""
# table             = ""
# view              = ""
# materialized-view = ""
# function          = ""
# sequence          = ""
# type              = ""
# trigger           = ""
# column            = ""
# index             = "▤"
# primary-key       = ""
# foreign-key       = ""
# role              = ""
# roles             = ""
# favourites        = ""
# recent            = ""
# query             = "≡"
# folder            = "▸"
# plan              = "⊳"
# note              = ""
# problem           = "✗"
# ai                = "✦"
# fold-closed       = "▸"
# fold-open         = "▾"
# field             = "▸"
# close             = "×"
# dot               = "●"
# sort-up           = "↑"
# sort-down         = "↓"
# prompt            = "❯"
# step-back         = "‹"
# step-on           = "›"
# banner            = "⚑"
# new-tab           = "+"

# Colour overrides for the selected theme.
#
# [ui.colors]
# accent = "#7aa2f7"

# ─────────────────────────────────────────────────────────────────────────────
# Keys
#
# Custom bindings replace preset bindings. Omitted actions keep their preset bindings.
# `config.example.toml` lists actions by scope.
# ─────────────────────────────────────────────────────────────────────────────

[keys]
preset = "default"

# [keys.global]
# run-at-cursor = ["ctrl+r", "f5"]

# ─────────────────────────────────────────────────────────────────────────────
# AI chat
#
# The chat sends a question to a provider over HTTP, or to a coding agent over ACP.
# ─────────────────────────────────────────────────────────────────────────────

[ai]
enabled              = true          # false disables the AI chat, its bindings, and its interface elements
default_provider     = "anthropic"   # anthropic openai openai_compatible
# default_agent      = "claude"      # the chat sends to this agent instead of the provider
statement_timeout_ms = 30000         # execution time limit for one AI chat query, in milliseconds

# The API key source is an environment variable.

[ai.providers.anthropic]
model        = "claude-opus-5"
api_key_env  = "ANTHROPIC_API_KEY"
# base_url_env = "ANTHROPIC_BASE_URL"   # the environment variable for a custom provider address

[ai.providers.openai]
model        = "gpt-5"
api_key_env  = "OPENAI_API_KEY"
# base_url_env = "OPENAI_BASE_URL"

# Any server that speaks the OpenAI chat API, such as a model on this machine.
#
# [ai.providers.openai_compatible]
# model       = "qwen2.5-coder"
# base_url    = "http://127.0.0.1:11434/v1"
# api_key_env = "LOCAL_API_KEY"

# Coding agents, reached over ACP. An agent whose command is not on the PATH is listed as
# not installed. `npx` comes with Node.

[ai.agents.claude]
command = "npx"
args    = ["-y", "@zed-industries/claude-code-acp"]
env     = ["CLAUDECODE="]   # Claude Code refuses to run inside another Claude Code session

[ai.agents.codex]
command = "npx"
args    = ["-y", "@zed-industries/codex-acp"]

[ai.agents.opencode]
command = "opencode"
args    = ["acp"]
# model = "opencode/grok-code"   # empty keeps the model the agent is configured with

# ─────────────────────────────────────────────────────────────────────────────
# Agent access through `masume --mcp`
#
# An empty `profiles` list exposes no profiles. A profile `mcp` setting can reduce access but cannot exceed `access`.
# ─────────────────────────────────────────────────────────────────────────────

[mcp]
profiles   = []            # the exposed profiles, such as ["shop"]
access     = "read-only"   # off read-only read-write full
row_limit  = 500           # maximum rows per query
timeout_ms = 30000         # execution time limit for one query, in milliseconds

# Example colour overrides for the active theme. Every theme colour name is allowed here.
#
# Named colours are hex values. [ui.colors] and [ui.syntax] can reference these names.
#
# [ui.palette]
# blue   = "#7aa2f7"
# purple = "#bb9af7"
# red    = "#f7768e"

# Editor highlights. Each token kind is a table. fg and bg are hex values or colour names.
# bold, italic and underline are boolean flags. link is another token kind; the local properties override the linked style.
# See docs/themes.md for inheritance, custom parents, and the reserved system theme. Picker selections persist in [ui] theme.
#
# [ui.syntax]
# keyword    = { fg = "accent", bold = true }
# type       = { fg = "accent_alt" }
# string     = { fg = "success" }
# comment    = { fg = "muted", italic = true }
# number     = { fg = "accent_warm" }
# identifier = { fg = "text" }
# quoted     = { fg = "text" }
# operator   = { fg = "accent_alt" }
# parameter  = { fg = "danger" }
# problem    = { fg = "error", underline = true }
# bracket    = { fg = "on_accent", bg = "accent_alt" }
# guide      = { bg = "header" }
# match      = { fg = "on_accent", bg = "accent_warm" }


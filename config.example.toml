# Key bindings by scope. A configured action replaces the preset binding. Unlisted actions
# retain the preset binding. An empty list removes the binding. docs/keys.md lists every
# scope, action and default chord.
#
# [keys]
# preset = "default"
#
# [keys.global]
# refresh-objects = []
# run-at-cursor   = ["ctrl+r", "f5"]
#
# [keys.grid]
# copy-menu = ["alt+y"]

# The version masume wrote the file at. masume adds what a newer version brings to an older
# file. See docs/configuration.md#file-version.
#
# [masume]
# version = 1

# AI settings. One table per provider and one per agent.
# The api_key_env names below are configured examples, not built-in defaults.
# Direct api_key and base_url values take priority over their environment variables.
# A configured base URL gains /v1 unless the address already ends with /v1. Requests use /messages, /responses or /chat/completions.
#
# [ai]
# enabled              = true          # false disables the AI chat, its elements and its bindings.
# default_provider     = "anthropic"   # anthropic openai grok openai_compatible
# default_agent        = ""            # an agent of [ai.agents]. Empty sends to default_provider.
# statement_timeout_ms = 30000         # time limit for a statement that the model runs
#
# [ai.providers.anthropic]
# model        = "claude-opus-5"
# api_key_env  = "ANTHROPIC_API_KEY"
# api_key      = ""                   # Default: empty.
# base_url     = ""                   # Default: the provider address.
# base_url_env = "ANTHROPIC_BASE_URL" # Example. Default: empty.
#
# [ai.providers.openai]
# model        = "gpt-5"
# api_key_env  = "OPENAI_API_KEY"
# api_key      = ""                   # Default: empty.
# base_url     = ""                   # Default: the provider address.
# base_url_env = "OPENAI_BASE_URL"    # Example. Default: empty.
#
# [ai.providers.grok]
# model        = "grok-4.6"
# api_key_env  = "XAI_API_KEY"
# api_key      = ""                   # Default: empty.
# base_url     = ""                   # Default: https://api.x.ai/v1
#
# Any server with the OpenAI chat completions endpoint: Ollama, LM Studio, llama.cpp, vLLM.
# base_url and model are required. api_key is optional.
#
# [ai.providers.openai_compatible]
# model          = "qwen3-coder:30b"
# base_url       = "http://localhost:11434"
# api_key        = ""                 # Default: empty.
# max_tool_steps = 25                 # maximum provider rounds for one question

# A coding agent, reached over the Agent Client Protocol. masume runs the command as a child
# process and serves it the tools of the chat over the loopback address, so the agent reads
# the connection that is open. [mcp] below does not apply to the chat.
# The agent uses its own subscription and its own model. masume sends it no API key.
#
# A table of any other name adds an agent, and the settings screen writes one without an
# editor. claude and codex are started with npx, which comes with Node. Set command to
# another program where npx is not installed. An agent with no command is reported and left
# out.
#
# [ai.agents.claude]
# command = "npx"
# args    = ["-y", "@zed-industries/claude-code-acp"]
# model   = "haiku"                   # default sonnet haiku. Empty keeps the model of the agent.
# env     = ["CLAUDECODE="]           # extra environment, as NAME=VALUE. An empty value clears one.
#
# [ai.agents.opencode]
# command = "opencode"
# args    = ["acp"]
# model   = "opencode-go/deepseek-v4-flash"
#
# [ai.agents.codex]
# command = "npx"
# args    = ["-y", "@zed-industries/codex-acp"]
#
# [ai.agents.gemini]
# command = "gemini"
# args    = ["--experimental-acp"]

# MCP server settings for the agents that reach masume from outside. Profile mcp and
# read-only mode can lower the global access limit. The AI chat of the client does not read
# these; see docs/ai.md.
#
# [mcp]
# profiles   = []            # Allowed profiles. Empty serves none. Example: ["shop"].
# access     = "read-only"   # off read-only read-write full
# row_limit  = 500           # maximum rows one read returns
# timeout_ms = 30000         # Time limit for one agent statement, in milliseconds.
